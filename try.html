<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
    <title>Curved Cards Scroll Animation</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 200vh; /* enough scroll space */
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f0f0f0;
    overflow-x: hidden;
    font-family: sans-serif;
  }

  .cards-container {
    position: relative;
    width: 100%;
    height: 400px;
    overflow: visible;
  }

  .card {
    position: absolute;
    width: 120px;
    height: 180px;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 1.5rem;
    font-weight: bold;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<div class="cards-container">
  <div class="card">1</div>
  <div class="card">2</div>
  <div class="card">3</div>
  <div class="card">4</div>
  <div class="card">5</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.1/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.1/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.1/MotionPathPlugin.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger, MotionPathPlugin);

  const cards = document.querySelectorAll(".card");
  const container = document.querySelector(".cards-container");
  const width = window.innerWidth;

  // Create curved path points
  const curvePath = [
    {x: 100, y: 300},
    {x: 300, y: 100},
    {x: 500, y: 300},
    {x: 700, y: 100},
    {x: 900, y: 300},
  ];

  cards.forEach((card, i) => {
    gsap.set(card, {x: curvePath[i].x, y: curvePath[i].y});
  });

  // Scroll animation along curve
  cards.forEach((card, i) => {
    gsap.to(card, {
      motionPath: {
        path: [
          {x: curvePath[i].x, y: curvePath[i].y},
          {x: curvePath[i].x + width, y: curvePath[i].y} // move right
        ],
        curviness: 1.5
      },
      scrollTrigger: {
        trigger: container,
        start: "top center",
        end: "bottom top",
        scrub: true
      }
    });
  });
</script>
</body>
</html>
